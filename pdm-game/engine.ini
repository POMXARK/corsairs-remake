; The original Sea Dogs (PDM 1.061) on Storm Engine. Run via run.sh
; the window: run.sh FULLSCREEN=1|0 SCREEN=WxH, or the engine options --fullscreen, --windowed, --size WxH (docs/build.md)
full_screen = 0
screen_x = 1280
screen_y = 720
; a window with a frame, moved and resized by the mouse
window_borders = 1
; Linux holds the mouse in the window: Ctrl+Alt lets it go, a click in the window takes it back
mouse_release = 1
max_fps = 60
run_in_background = 1
Steam = 0
program_directory = program
run = main.c
; without it the engine uses the empty CONTROLS stub and the ship and the camera get no input
controls = pcs_controls
title = Sea Dogs on Storm Engine
; the fonts of the original converted by tools/pdm_ui.py
startFontIniFile = resource\ini\fonts.ini
font = pdm_logbook_20

[script]
debuginfo = 1
tracefiles = 1

[Sea]
FoamEnable = 1
