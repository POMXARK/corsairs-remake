; The original Sea Dogs (PDM 1.061) on Storm Engine. Run via run.sh
; the window: run.sh FULLSCREEN=1|0 SCREEN=WxH, or the engine options --fullscreen, --windowed, --size WxH (docs/build.md)
full_screen = 0
screen_x = 1280
screen_y = 720
; a window with a frame, moved and resized by the mouse
window_borders = 1
; Linux holds the mouse in the window: Ctrl+Alt lets it go, a click in the window takes it back
mouse_release = 1
max_fps = 60
; F9 starts and ends the video of the window (ffmpeg in PATH or ffmpeg_path), the file goes to Screenshots next to the F8 shots;
; the sound: record_audio_input = -f pulse -i <sink>.monitor (Linux) or -f dshow -i audio=<device> (Windows)
record_video = 1
; Windows: the sound of the game itself (WASAPI loopback), joined to the video by ffmpeg when the recording ends
record_audio_loopback = 1
run_in_background = 1
Steam = 0
program_directory = program
run = main.c
; without it the engine uses the empty CONTROLS stub and the ship and the camera get no input
controls = pcs_controls
title = Sea Dogs on Storm Engine
; the fonts of the original converted by tools/pdm_ui.py
startFontIniFile = resource\ini\fonts.ini
font = pdm_logbook_20

[script]
debuginfo = 1
tracefiles = 1

[Sea]
FoamEnable = 1

; the "Loading" banner of the original (tools/pdm_loading.py): 322x50 at (5,5) of the 800x600 screen, the atlas is a 3x3 grid of 512x64 cells
[ProgressImage]
RelativePosX = 0.00625
RelativePosY = 0.00833
RelativeWidth = 0.64
RelativeHeight = 0.08
HorisontalFramesCount = 3
VerticalFramesCount = 3
