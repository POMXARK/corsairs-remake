; Corsairs remake: main menu and the sea battle. Run via ../run.sh
full_screen = 0
screen_x = 800
screen_y = 600
max_fps = 60
run_in_background = 1
Steam = 0
program_directory = program
run = menu.c
; without it the engine uses the empty CONTROLS stub and the menu gets no input
controls = pcs_controls
title = Corsairs Remake
startFontIniFile = resource\ini\fonts.ini
font = interface_normal

[script]
debuginfo = 1
tracefiles = 1

[Sea]
; foam on the wave crests
FoamEnable = 1
